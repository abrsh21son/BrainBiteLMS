# DigitalOcean App Platform configuration
name: brainbite-backend
region: nyc

services:
  - name: api
    github:
      repo: abrsh21son/BrainBiteLMS
      branch: main
      deploy_on_push: true
    source_dir: backend
    build_command: npm install && npm run build
    run_command: npm run start:prod
    environment_slug: node-js
    instance_count_slug: basic-xxs
    instance_size_slug: basic-xxs
    http_port: 3000
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: AI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: AI_API_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: llama-3.1-8b-instant
      - key: FRONTEND_URL
        scope: RUN_TIME
        type: SECRET
